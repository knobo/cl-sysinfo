name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.lisp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lisp:
          - sbcl-bin
          - ccl-bin
    env:
      LISP: ${{ matrix.lisp }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install ${{ matrix.lisp }}
        run: |
          ros install ${{ matrix.lisp }}
          ros use ${{ matrix.lisp }}

      - name: Run tests
        run: ./scripts/run-tests.sh
